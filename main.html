<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="quiz-container">
        <h1>General Knowledge Quiz</h1>
        <form id="quiz-form">
            <div class="question">
                <p>1. What is the capital of France?</p>
                <label><input type="radio" name="q1" value="a"> London</label>
                <label><input type="radio" name="q1" value="b"> Paris</label>
                <label><input type="radio" name="q1" value="c"> Berlin</label>
                <label><input type="radio" name="q1" value="d"> Madrid</label>
            </div>

            <div class="question">
                <p>2. Which planet is known as the Red Planet?</p>
                <label><input type="radio" name="q2" value="a"> Venus</label>
                <label><input type="radio" name="q2" value="b"> Mars</label>
                <label><input type="radio" name="q2" value="c"> Jupiter</label>
                <label><input type="radio" name="q2" value="d"> Saturn</label>
            </div>

            <div class="question">
                <p>3. What is the largest mammal in the world?</p>
                <label><input type="radio" name="q3" value="a"> Elephant</label>
                <label><input type="radio" name="q3" value="b"> Blue Whale</label>
                <label><input type="radio" name="q3" value="c"> Giraffe</label>
                <label><input type="radio" name="q3" value="d"> Polar Bear</label>
            </div>

            <div class="question">
                <p>4. Which language is primarily used for web development?</p>
                <label><input type="radio" name="q4" value="a"> Java</label>
                <label><input type="radio" name="q4" value="b"> Python</label>
                <label><input type="radio" name="q4" value="c"> JavaScript</label>
                <label><input type="radio" name="q4" value="d"> C++</label>
            </div>

            <div class="question">
                <p>5. What year did World War II end?</p>
                <label><input type="radio" name="q5" value="a"> 1943</label>
                <label><input type="radio" name="q5" value="b"> 1945</label>
                <label><input type="radio" name="q5" value="c"> 1947</label>
                <label><input type="radio" name="q5" value="d"> 1950</label>
            </div>

            <button type="submit" id="submit-btn">Submit Quiz</button>
        </form>
        <div id="result" class="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
